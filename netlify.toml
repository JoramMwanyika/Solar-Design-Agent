# Netlify configuration file
# Ref: https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  # Build setting defaults. (Note: Netlify doesn't host live Streamlit python apps, 
  # but this allows the build stage to pass successfully for visual/static deployment checks).
  command = "echo 'Build successful'"
  publish = "static"

[build.environment]
  # Omit these environment keys from Netlify's build-time secrets scan.
  # Their values are standard public model name strings (e.g. 'gpt-4o') used as
  # fallbacks in the source code, which triggers false-positive secret detections.
  SECRETS_SCAN_OMIT_KEYS = "FEATHERLESS_MODEL,GITHUB_MODEL,GITHUB_MODELS_ENDPOINT"
